workflows:
  luma-ios-unsigned:
    name: Luma Camera - iOS unsigned build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Build for iPhone without signing
        script: |
          set -euo pipefail
          xcodebuild \
            -project "$CM_BUILD_DIR/LumaCamera.xcodeproj" \
            -scheme LumaCamera \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/build" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned IPA for Windows sideloading
        script: |
          set -euo pipefail
          APP="$CM_BUILD_DIR/build/Build/Products/Release-iphoneos/LumaCamera.app"
          test -d "$APP"
          mkdir -p "$CM_BUILD_DIR/ipa/Payload"
          cp -R "$APP" "$CM_BUILD_DIR/ipa/Payload/"
          cd "$CM_BUILD_DIR/ipa"
          /usr/bin/zip -r "$CM_BUILD_DIR/LumaCamera-unsigned.ipa" Payload
    artifacts:
      - LumaCamera-unsigned.ipa
      - /tmp/xcodebuild_logs/*.log

